name: Generate Stats Images

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install requirements
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r requirements.txt

    - name: Generate images
      run: |
        mkdir -p generated
        python3 generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        COUNT_STATS_FROM_FORKS: ${{ secrets.COUNT_STATS_FROM_FORKS }}

    - name: Commit to output branch
      run: |
        git config --global user.name "github-stats[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Save generated files
        mv generated /tmp/generated

        # Switch to or create output branch
        git checkout output 2>/dev/null || git checkout --orphan output

        # Clean and recreate
        git rm -rf . 2>/dev/null || true
        rm -rf generated
        mv /tmp/generated .

        # Commit and push
        git add generated/
        git commit -m "Update generated files - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
        git push origin output -f
